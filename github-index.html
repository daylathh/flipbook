<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Cẩm nang thông tin tuyển dụng — HANU Job Fair 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7ff;
      --muted: #aebbd2;
      --blue: #3f7cff;
      --cyan: #58d9ff;
      --line: rgba(210, 228, 255, .14);
      --panel: rgba(14, 29, 53, .72);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(40, 93, 180, .24), transparent 47%),
        radial-gradient(ellipse at 84% 10%, rgba(100, 49, 160, .16), transparent 34%),
        linear-gradient(145deg, #09182f 0%, #061124 54%, #0c1730 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app {
      height: 100dvh;
      min-height: 320px;
      overflow: hidden;
      isolation: isolate;
    }
    .topbar {
      min-height: 76px;
      padding: 16px clamp(16px, 4vw, 52px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex: 0 0 auto;
      border-bottom: 1px solid rgba(255,255,255,.055);
      background: linear-gradient(180deg, rgba(5, 14, 29, .46), rgba(5, 14, 29, 0));
    }
    .identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark {
      width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center;
      border: 1px solid rgba(121, 185, 255, .5); border-radius: 13px;
      background: linear-gradient(145deg, rgba(53, 126, 255, .95), rgba(100, 87, 245, .76));
      box-shadow: 0 7px 24px rgba(34, 103, 255, .28), inset 0 1px rgba(255,255,255,.35);
      color: white; font-size: 19px; font-weight: 850; letter-spacing: -.05em;
    }
    .eyebrow {
      margin: 0 0 3px; color: #8db8ff; font-size: 10px; font-weight: 800;
      letter-spacing: .19em; text-transform: uppercase;
    }
    h1 { margin: 0; overflow: hidden; color: #f7f9ff; font-size: clamp(15px, 1.55vw, 20px); font-weight: 680; letter-spacing: -.025em; text-overflow: ellipsis; white-space: nowrap; }
    .top-hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .top-hint kbd {
      margin: 0 2px; padding: 3px 6px; border: 1px solid rgba(213,228,255,.2); border-radius: 5px;
      background: rgba(255,255,255,.055); color: #e6eeff; font: inherit; font-size: 11px;
    }
    .reader {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .book {
      position: relative;
      width: min(96vw, calc(94dvh * 1.4142), 1600px);
      aspect-ratio: 1.4142 / 1;
      perspective: 2300px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 24px 42px rgba(0,0,0,.44));
      -webkit-tap-highlight-color: transparent;
    }
    .spread, .single {
      position: absolute;
      inset: 0;
      overflow: visible;
      border-radius: 5px;
      transform-style: preserve-3d;
    }
    .spread-book::before {
      content: ""; position: absolute; z-index: 0; inset: 0; pointer-events: none; border-radius: 5px;
      background: #e9e7e1;
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 13px 38px rgba(0,0,0,.34);
    }
    .spread-book::after {
      content: ""; position: absolute; z-index: 5; top: 0; bottom: 0; left: 50%; width: 18px;
      transform: translateX(-50%); pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,.14), rgba(255,255,255,.16) 43%, rgba(0,0,0,.1));
      opacity: .47;
    }
    .page {
      position: absolute; top: 0; height: 100%; width: 50%; overflow: hidden;
      background: #f4f2ed;
      z-index: 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .page.left { left: 0; border-radius: 5px 0 0 5px; box-shadow: inset -8px 0 13px -13px rgba(0,0,0,.7); }
    .page.right { right: 0; border-radius: 0 5px 5px 0; box-shadow: inset 8px 0 13px -13px rgba(0,0,0,.7); }
    .page.empty { background: linear-gradient(90deg, #ece9e1, #f5f3ed 70%, #e8e5dc); }
    .page img, .face img, .mobile-page img {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      object-fit: fill; user-select: none; -webkit-user-drag: none;
    }
    .flipper {
      position: absolute; top: 0; z-index: 8; width: 50%; height: 100%;
      transform-style: preserve-3d; transition: transform 760ms cubic-bezier(.22,.68,.16,1);
      will-change: transform; pointer-events: none;
    }
    .flipper.next { left: 50%; transform-origin: left center; }
    .flipper.prev { left: 0; transform-origin: right center; }
    .flipper.turn-next { transform: rotateY(-180deg); }
    .flipper.turn-prev { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; overflow: hidden; background: #f4f2ed;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .face.front { box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
    .face.back { transform: rotateY(180deg); box-shadow: inset 0 0 24px rgba(0,0,0,.12); }
    .single-book { display: none; }
    .corner-overlay {
      position: absolute; z-index: 20; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(96vw, calc(94dvh * 1.4142), 1600px);
      aspect-ratio: 1.4142 / 1; pointer-events: none;
    }
    .corner-button {
      position: absolute; top: 50%; bottom: auto; width: 34px; height: 64px;
      display: grid; place-items: center; border: 1px solid rgba(255,255,255,.48); border-radius: 18px;
      background: rgba(8, 20, 41, .58); color: white; cursor: pointer; pointer-events: auto;
      backdrop-filter: blur(10px); box-shadow: 0 5px 20px rgba(0,0,0,.28);
      transition: background .18s ease, transform .18s ease, opacity .18s ease;
    }
    .corner-button.prev { left: -17px; border-radius: 14px 0 0 14px; }
    .corner-button.next { right: -17px; border-radius: 0 14px 14px 0; }
    .corner-button:hover:not(:disabled) { transform: scale(1.06); background: rgba(49, 105, 213, .85); }
    .corner-button:disabled { opacity: .26; cursor: default; }
    .corner-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .view-toggle { display: none; }
    .mobile-page {
      position: absolute; inset: 0; overflow: hidden; border-radius: 4px;
      background: #f4f2ed; box-shadow: 0 0 0 1px rgba(255,255,255,.12), inset 0 0 0 1px rgba(0,0,0,.04);
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .mobile-page.empty { background: #f4f2ed; }
    .mobile-flipper {
      position: absolute; z-index: 4; inset: 0; transform-style: preserve-3d;
      transform-origin: center center; transition: transform 620ms cubic-bezier(.22,.68,.16,1);
      will-change: transform; pointer-events: none;
    }
    .mobile-flipper.turn-next { transform: rotateY(-180deg); }
    .mobile-flipper.turn-prev { transform: rotateY(180deg); }
    .mobile-face {
      position: absolute; inset: 0; overflow: hidden; background: #f4f2ed;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .mobile-face.back { transform: rotateY(180deg); }
    .toolbar {
      min-height: 82px; padding: 12px clamp(14px, 4vw, 54px) 18px;
      display: grid; grid-template-columns: 1fr minmax(220px, 470px) 1fr; align-items: center;
      gap: 16px; flex: 0 0 auto;
    }
    .toolbar-group { display: flex; align-items: center; gap: 9px; }
    .toolbar-group.right { justify-content: flex-end; }
    .tool-button {
      width: 42px; height: 42px; display: inline-grid; place-items: center; padding: 0;
      border: 1px solid var(--line); border-radius: 13px; background: var(--panel);
      color: #f2f6ff; cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,.13);
    }
    .tool-button:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(135,190,255,.47); background: rgba(34,61,104,.88); }
    .tool-button:active:not(:disabled) { transform: translateY(0) scale(.97); }
    .tool-button:disabled { opacity: .38; cursor: default; }
    .tool-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .readout { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 5px 14px; }
    .page-label { color: #f3f6ff; font-size: 12px; font-weight: 700; letter-spacing: .025em; white-space: nowrap; }
    .page-hint { color: #8291aa; font-size: 11px; white-space: nowrap; }
    input[type="range"] {
      grid-column: 1 / -1; width: 100%; height: 4px; margin: 6px 0 0;
      appearance: none; -webkit-appearance: none; border-radius: 999px; outline: none; cursor: pointer;
      background: linear-gradient(90deg, #448bff, #6b67ff);
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 14px; height: 14px; appearance: none; -webkit-appearance: none; border: 2px solid #fff;
      border-radius: 50%; background: #528dff; box-shadow: 0 0 0 4px rgba(82,141,255,.2);
    }
    input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border: 2px solid #fff; border-radius: 50%; background: #528dff; box-shadow: 0 0 0 4px rgba(82,141,255,.2); }
    .footer-note {
      position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
      color: rgba(185,199,223,.5); font-size: 10px; letter-spacing: .035em; white-space: nowrap; pointer-events: none;
    }
    button:focus-visible, input:focus-visible { outline: 2px solid #74cfff; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      .reader { padding: 2px 10px 0; }
      .spread-book { display: none; }
      .single-book {
        display: block; width: min(86vw, calc(88dvh * .7068), 700px);
        aspect-ratio: .7068 / 1; perspective: 1900px;
      }
      .spread-book.mobile-spread { display: block; width: min(94vw, calc(70dvh * 1.4142), 980px); }
      .corner-overlay { width: min(86vw, calc(88dvh * .7068), 700px); aspect-ratio: .7068 / 1; }
      .corner-overlay.spread-overlay { width: min(94vw, calc(70dvh * 1.4142), 980px); aspect-ratio: 1.4142 / 1; }
      .corner-button { width: 30px; height: 58px; }
      .corner-button.prev { left: -15px; }
      .corner-button.next { right: -15px; }
      .view-toggle {
        position: absolute; display: flex; top: -42px; left: 50%; transform: translateX(-50%);
        padding: 3px; gap: 2px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px;
        background: rgba(8,20,41,.78); backdrop-filter: blur(10px); pointer-events: auto;
      }
      .view-option {
        min-width: 70px; height: 30px; padding: 0 9px; border: 0; border-radius: 9px;
        background: transparent; color: #c4d0e4; font-size: 11px; font-weight: 650; cursor: pointer;
      }
      .view-option[aria-pressed="true"] { background: #316bd4; color: #fff; }
    }
    @media (max-width: 400px) {
      .toolbar { grid-template-columns: auto minmax(88px, 1fr) auto; gap: 6px; padding-left: 10px; padding-right: 10px; }
      .tool-button { width: 36px; height: 36px; }
      .readout { gap: 4px; }
      .page-label { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <main class="reader" aria-label="Flipbook cẩm nang tuyển dụng">
      <div class="book spread-book" id="spreadBook" aria-label="Sách mở hai trang"></div>
      <div class="book single-book" id="singleBook" aria-label="Trang sách"></div>
      <div class="corner-overlay" aria-label="Điều khiển lật trang">
        <div class="view-toggle" role="group" aria-label="Chế độ hiển thị trên điện thoại">
          <button class="view-option" id="singleViewButton" type="button" aria-pressed="true">1 trang</button>
          <button class="view-option" id="spreadViewButton" type="button" aria-pressed="false">2 trang</button>
        </div>
        <button class="corner-button prev" id="prevButton" type="button" aria-label="Lật về trước" title="Lật về trước">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="corner-button next" id="nextButton" type="button" aria-label="Lật sang trang tiếp" title="Lật sang trang tiếp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </main>
  </div>
  <script>
    const PAGE_IMAGES = ["page-01.jpg","page-02.jpg","page-03.jpg","page-04.jpg","page-05.jpg","page-06.jpg","page-07.jpg","page-08.jpg","page-09.jpg","page-10.jpg","page-11.jpg","page-12.jpg","page-13.jpg","page-14.jpg","page-15.jpg","page-16.jpg","page-17.jpg","page-18.jpg","page-19.jpg","page-20.jpg","page-21.jpg","page-22.jpg","page-23.jpg","page-24.jpg","page-25.jpg","page-26.jpg","page-27.jpg","page-28.jpg"];
    const TOTAL_PAGES = PAGE_IMAGES.length;
    const SPREADS = [[null, PAGE_IMAGES[0]]];
    for (let i = 1; i <= 13; i++) SPREADS.push([PAGE_IMAGES[i * 2 - 1], PAGE_IMAGES[i * 2]]);
    SPREADS.push([PAGE_IMAGES[TOTAL_PAGES - 1], null]);

    const spreadBook = document.getElementById('spreadBook');
    const singleBook = document.getElementById('singleBook');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const singleViewButton = document.getElementById('singleViewButton');
    const spreadViewButton = document.getElementById('spreadViewButton');
    const mobileMode = window.matchMedia('(max-width: 760px)');
    let spreadIndex = 0;
    let singleIndex = 0;
    let mobileView = 'single';
    let isTurning = false;

    function isMobile() { return mobileMode.matches; }
    function isSingleView() { return isMobile() && mobileView === 'single'; }
    function makePage(src, side, label) {
      const node = document.createElement('div');
      node.className = 'page ' + side + (src ? '' : ' empty');
      if (src) {
        const image = document.createElement('img');
        image.src = src;
        image.alt = label || '';
        image.draggable = false;
        node.appendChild(image);
      }
      return node;
    }
    function makeFace(src, face, label) {
      const node = document.createElement('div');
      node.className = 'face ' + face;
      if (src) {
        const image = document.createElement('img');
        image.src = src;
        image.alt = label || '';
        image.draggable = false;
        node.appendChild(image);
      }
      return node;
    }
    function makeMobilePage(src, className, label) {
      const node = document.createElement('div');
      node.className = className + (src ? '' : ' empty');
      if (src) {
        const image = document.createElement('img');
        image.src = src;
        image.alt = label || '';
        image.draggable = false;
        node.appendChild(image);
      }
      return node;
    }
    function renderSpread() {
      const state = SPREADS[spreadIndex];
      spreadBook.replaceChildren(makePage(state[0], 'left', ''), makePage(state[1], 'right', ''));
    }
    function renderSingle() {
      singleBook.replaceChildren(makeMobilePage(PAGE_IMAGES[singleIndex], 'mobile-page', 'Trang ' + (singleIndex + 1)));
    }
    function updateControls() {
      const single = isSingleView();
      spreadBook.classList.toggle('mobile-spread', isMobile() && !single);
      const position = single ? singleIndex : spreadIndex;
      const maximum = single ? TOTAL_PAGES - 1 : SPREADS.length - 1;
      prevButton.disabled = isTurning || position <= 0;
      nextButton.disabled = isTurning || position >= maximum;
      singleViewButton.setAttribute('aria-pressed', String(mobileView === 'single'));
      spreadViewButton.setAttribute('aria-pressed', String(mobileView === 'spread'));
      document.querySelector('.corner-overlay').classList.toggle('spread-overlay', isMobile() && !single);
    }
    function renderCurrent() {
      if (isSingleView()) renderSingle();
      else renderSpread();
      updateControls();
    }
    function currentMobileIndexForSpread(index) {
      if (index === 0) return 0;
      if (index === SPREADS.length - 1) return TOTAL_PAGES - 1;
      return index * 2 - 1;
    }
    function spreadIndexForMobilePage(index) {
      if (index === 0) return 0;
      if (index === TOTAL_PAGES - 1) return SPREADS.length - 1;
      return Math.ceil(index / 2);
    }
    function finishAfterTransition(node, finish) {
      let completed = false;
      const done = function() {
        if (completed) return;
        completed = true;
        clearTimeout(timer);
        finish();
      };
      node.addEventListener('transitionend', function(event) {
        if (event.target === node && event.propertyName === 'transform') done();
      });
      const timer = setTimeout(done, 1050);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          if (node.isConnected) node.classList.add(node.dataset.turnClass);
        });
      });
    }
    function turnSpread(direction) {
      if (isTurning) return;
      const nextIndex = spreadIndex + (direction === 'next' ? 1 : -1);
      if (nextIndex < 0 || nextIndex >= SPREADS.length) return;
      const current = SPREADS[spreadIndex];
      const target = SPREADS[nextIndex];
      spreadBook.replaceChildren();
      let flipper;
      if (direction === 'next') {
        spreadBook.append(makePage(current[0], 'left', ''), makePage(target[1], 'right', ''));
        flipper = document.createElement('div');
        flipper.className = 'flipper next';
        flipper.dataset.turnClass = 'turn-next';
        flipper.append(makeFace(current[1], 'front', ''), makeFace(target[0], 'back', ''));
      } else {
        spreadBook.append(makePage(target[0], 'left', ''), makePage(current[1], 'right', ''));
        flipper = document.createElement('div');
        flipper.className = 'flipper prev';
        flipper.dataset.turnClass = 'turn-prev';
        flipper.append(makeFace(current[0], 'front', ''), makeFace(target[1], 'back', ''));
      }
      spreadBook.appendChild(flipper);
      isTurning = true;
      updateControls();
      finishAfterTransition(flipper, function() {
        spreadIndex = nextIndex;
        isTurning = false;
        renderSpread();
        updateControls();
      });
    }
    function turnSingle(direction) {
      if (isTurning) return;
      const nextIndex = singleIndex + (direction === 'next' ? 1 : -1);
      if (nextIndex < 0 || nextIndex >= TOTAL_PAGES) return;
      singleBook.replaceChildren();
      const target = PAGE_IMAGES[nextIndex];
      singleBook.appendChild(makeMobilePage(target, 'mobile-page', 'Trang ' + (nextIndex + 1)));
      const flipper = document.createElement('div');
      flipper.className = 'mobile-flipper';
      flipper.dataset.turnClass = direction === 'next' ? 'turn-next' : 'turn-prev';
      flipper.append(
        makeFace(PAGE_IMAGES[singleIndex], 'front', 'Trang ' + (singleIndex + 1)),
        makeFace(target, 'back', 'Trang ' + (nextIndex + 1))
      );
      singleBook.appendChild(flipper);
      isTurning = true;
      updateControls();
      finishAfterTransition(flipper, function() {
        singleIndex = nextIndex;
        isTurning = false;
        renderSingle();
        updateControls();
      });
    }
    function turn(direction) {
      if (isSingleView()) turnSingle(direction);
      else turnSpread(direction);
    }
    prevButton.addEventListener('click', function() { turn('prev'); });
    nextButton.addEventListener('click', function() { turn('next'); });
    singleViewButton.addEventListener('click', function() {
      if (!isMobile() || mobileView === 'single' || isTurning) return;
      singleIndex = currentMobileIndexForSpread(spreadIndex);
      mobileView = 'single';
      renderCurrent();
    });
    spreadViewButton.addEventListener('click', function() {
      if (!isMobile() || mobileView === 'spread' || isTurning) return;
      spreadIndex = spreadIndexForMobilePage(singleIndex);
      mobileView = 'spread';
      renderCurrent();
    });
    document.addEventListener('keydown', function(event) {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target && /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
      if (event.key === 'ArrowRight' || event.key === 'PageDown') {
        event.preventDefault(); turn('next');
      } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault(); turn('prev');
      }
    });
    mobileMode.addEventListener('change', function(event) {
      if (event.matches) singleIndex = currentMobileIndexForSpread(spreadIndex);
      else spreadIndex = spreadIndexForMobilePage(singleIndex);
      isTurning = false;
      renderCurrent();
    });
    let pointerStart = null;
    singleBook.addEventListener('pointerdown', function(event) { pointerStart = event.clientX; });
    singleBook.addEventListener('pointerup', function(event) {
      if (pointerStart === null) return;
      const distance = event.clientX - pointerStart;
      if (Math.abs(distance) > 45) turn(distance < 0 ? 'next' : 'prev');
      pointerStart = null;
    });
    spreadBook.addEventListener('pointerdown', function(event) { pointerStart = event.clientX; });
    spreadBook.addEventListener('pointerup', function(event) {
      if (pointerStart === null) return;
      const distance = event.clientX - pointerStart;
      if (Math.abs(distance) > 55) turn(distance < 0 ? 'next' : 'prev');
      pointerStart = null;
    });
    renderCurrent();
  </script>
</body>
</html>
